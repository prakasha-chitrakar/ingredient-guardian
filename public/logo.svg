<svg xmlns="http://www.w3.org/2000/svg" viewBox="-27 0 234 234">
  <!-- Unlabel mark: a round flask with a sprouting leaf and a bubble cut through it.
       Traced from design/unlabel-logo-reference.png. Single colour. -->
  <defs>
    <mask id="cutouts">
      <rect x="-27" width="234" height="234" fill="#fff"/>
      <g fill="#000" stroke="#000" stroke-linecap="round" stroke-linejoin="round">
        <!-- big leaf -->
        <path stroke-width="3" d="M66 196C60 150 95 108 143 99C145 140 115 185 66 196Z"/>
        <!-- small leaf -->
        <path stroke-width="3" d="M59 182C40 178 28 160 29 132C48 138 60 155 59 182Z"/>
        <!-- stem -->
        <path fill="none" stroke-width="10" d="M57 213Q60 199 69 187"/>
        <!-- bubble -->
        <circle cx="119" cy="79" r="9.5"/>
      </g>
      <!-- leaf vein: put a thin line of flask colour back through the big leaf -->
      <path d="M70 190Q88 152 116 127" fill="none" stroke="#fff" stroke-width="6.5" stroke-linecap="round"/>
    </mask>
  </defs>
  <g fill="#3F4D34" mask="url(#cutouts)">
    <rect x="42" y="0" width="98" height="15" rx="6"/>
    <rect x="57" y="10" width="67" height="70"/>
    <circle cx="90" cy="144" r="90"/>
  </g>
</svg>

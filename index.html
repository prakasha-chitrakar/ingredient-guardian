<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="preload" as="image" href="/logo-animated.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preload" as="image" href="/img/hero.webp" type="image/webp" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Unlabel" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="Unlabel: snap any ingredient label and see what it’s hiding, and what it means for you." />
    <title>Unlabel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@1,9..144,400..600,100&family=Nunito:wght@700..900&family=Nunito+Sans:opsz,wght@6..12,500..800&display=swap" rel="stylesheet" />
    <style>
      /* Loading screen: lives here so it paints before any JavaScript loads. */
      #splash {
        position: fixed; inset: 0; z-index: 100;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        background: #fbf4f0;
        font-family: 'Nunito Sans', system-ui, sans-serif; color: #26301f;
        transition: opacity 0.45s ease, transform 0.45s ease;
      }
      #splash::before, #splash::after {
        content: ''; position: absolute; border-radius: 50%; filter: blur(60px); opacity: 0.6; z-index: -1;
      }
      #splash::before { width: 70vmax; height: 70vmax; left: -30vmax; top: -30vmax; background: #efb6a2; }
      #splash::after { width: 60vmax; height: 60vmax; right: -30vmax; bottom: -30vmax; background: #c5d7e3; }
      #splash img { width: 132px; height: 132px; animation: splash-in 0.6s cubic-bezier(.2,.7,.2,1) both, float 3.2s ease-in-out 0.6s infinite; }
      #splash .splash__name { font-family: 'Nunito', 'Nunito Sans', system-ui, sans-serif; color: #3f4d34; font-weight: 900; font-size: 32px; letter-spacing: -0.02em; animation: splash-in 0.6s 0.1s cubic-bezier(.2,.7,.2,1) both; }
      #splash .splash__tag { font-family: 'Fraunces', Georgia, serif; font-style: italic; font-variation-settings: 'SOFT' 100; font-size: 18px; color: #3f4d34; opacity: 0.8; animation: splash-in 0.6s 0.2s cubic-bezier(.2,.7,.2,1) both; }
      #splash.is-done { opacity: 0; transform: scale(1.03); pointer-events: none; }
      @keyframes splash-in { from { opacity: 0; transform: translateY(8px); } }
      @keyframes float { 50% { transform: translateY(-5px); } }
      @media (prefers-reduced-motion: reduce) { #splash img, #splash p { animation: none; } }
    </style>
  </head>
  <body>
    <noscript>Unlabel needs JavaScript turned on.</noscript>
    <div id="splash" aria-hidden="true">
      <img src="/logo-animated.svg" alt="" width="132" height="132" />
      <p class="splash__name">Unlabel</p>
      <p class="splash__tag">Reading the small print…</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="-27 -40 234 274">
  <!-- Animated Unlabel mark for the loading screen: same drawing as logo.svg, plus
       swaying leaves, a bobbing bubble, tiny bubbles drifting out of the neck and a
       soft glow behind. -->
  <style>
    .halo { transform-origin: 90px 144px; animation: halo 3.2s ease-in-out infinite; }
    .sprout { transform-origin: 57px 213px; animation: sway 3.2s ease-in-out infinite; }
    .bubble { transform-origin: 119px 79px; animation: bob 2.4s ease-in-out infinite; }
    .steam { animation: steam 2.8s ease-out infinite; opacity: 0; }
    .steam.s2 { animation-delay: 0.9s; }
    .steam.s3 { animation-delay: 1.8s; }
    @keyframes halo { 0%, 100% { transform: scale(0.9); opacity: 0.35; } 50% { transform: scale(1.08); opacity: 0.6; } }
    @keyframes sway { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(4deg); } }
    @keyframes bob { 50% { transform: translateY(-5px) scale(1.08); } }
    @keyframes steam {
      0% { transform: translateY(0); opacity: 0; }
      20% { opacity: 1; }
      100% { transform: translateY(-38px); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .halo, .sprout, .bubble, .steam { animation: none; }
    }
  </style>
  <defs>
    <mask id="cutouts">
      <rect x="-27" y="-40" width="234" height="274" fill="#fff"/>
      <g class="sprout">
        <g fill="#000" stroke="#000" stroke-linecap="round" stroke-linejoin="round">
          <path stroke-width="1" d="M66 196C60 150 95 108 143 99C145 140 115 185 66 196Z"/>
          <path stroke-width="1" d="M59 182C40 178 28 160 29 132C48 138 60 155 59 182Z"/>
          <path fill="none" stroke-width="7" d="M57 213Q60 199 69 187"/>
        </g>
        <path d="M70 190Q88 152 116 127" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/>
      </g>
      <circle class="bubble" cx="119" cy="79" r="7.5" fill="#000"/>
    </mask>
  </defs>
  <circle class="halo" cx="90" cy="144" r="104" fill="#EFB6A2"/>
  <g fill="#3F4D34" mask="url(#cutouts)">
    <rect x="42" y="0" width="98" height="15" rx="6"/>
    <rect x="57" y="10" width="67" height="70"/>
    <circle cx="90" cy="144" r="90"/>
  </g>
  <g fill="#3F4D34">
    <circle class="steam" cx="84" cy="-6" r="5"/>
    <circle class="steam s2" cx="98" cy="-4" r="3.5"/>
    <circle class="steam s3" cx="90" cy="-8" r="2.8"/>
  </g>
</svg>

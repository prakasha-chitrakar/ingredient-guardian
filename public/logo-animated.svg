<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Animated "Bubble flask" for the loading screen: same drawing as logo.svg, plus
       bubbles rising through the flask, a gentle breathing squish, a floating
       electron and a soft glow. -->
  <style>
    .halo { transform-origin: 60px 78px; animation: halo 3s ease-in-out infinite; }
    .flask { transform-origin: 60px 105px; animation: breathe 3s ease-in-out infinite; }
    .electron { animation: bob 3s ease-in-out infinite; }
    .bubble { animation: rise 2.7s ease-in infinite; }
    .bubble.b2 { animation-delay: 0.9s; }
    .bubble.b3 { animation-delay: 1.8s; }
    @keyframes halo { 0%, 100% { transform: scale(0.9); opacity: 0.35; } 50% { transform: scale(1.12); opacity: 0.65; } }
    @keyframes breathe { 50% { transform: scale(1.025, 0.975); } }
    @keyframes bob { 50% { transform: translate(-2px, -5px); } }
    @keyframes rise {
      0% { transform: translateY(8px); opacity: 0; }
      20% { opacity: 1; }
      85% { opacity: 1; }
      100% { transform: translateY(-38px); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .halo, .flask, .electron, .bubble { animation: none; }
    }
  </style>
  <defs>
    <mask id="bubbles">
      <rect width="120" height="120" fill="#fff"/>
      <circle class="bubble" cx="52" cy="88" r="6" fill="#000"/>
      <circle class="bubble b2" cx="66" cy="84" r="4.5" fill="#000"/>
      <circle class="bubble b3" cx="58" cy="90" r="3.5" fill="#000"/>
    </mask>
  </defs>
  <circle class="halo" cx="60" cy="78" r="34" fill="#EFB6A2"/>
  <g class="flask">
    <path fill="#3F4D34" mask="url(#bubbles)" d="M48.5 15H71.5A6.5 6.5 0 0 1 71.5 28H69V49Q69 53 73 54.3A27 27 0 1 1 47 54.3Q51 53 51 49V28H48.5A6.5 6.5 0 0 1 48.5 15Z"/>
  </g>
  <circle class="electron" cx="93" cy="50" r="8" fill="#3F4D34"/>
</svg>
